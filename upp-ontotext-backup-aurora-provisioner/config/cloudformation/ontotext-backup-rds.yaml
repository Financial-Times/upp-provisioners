---
AWSTemplateFormatVersion: '2010-09-09'
Description: This template deploys an Aurora cluster with one instance for Ontotext backup data.

Metadata:
    AWS::CloudFormation::Interface:
        ParameterGroups:
            - Label:
                  default: FT standard tagging
              Parameters:
                  - EnvironmentTag
                  - TeamDLTag
                  - SystemCodeTag

Parameters:
    VpcId:
        Description: The ID of the VPC that will access the cluster.
        Type: String

    ResourcesSgId:
        Description: The ID of the resources SG for VPN DB access.
        Type: String

    DBSubnetIds:
        Description: List of comma separated subnet IDs
        Type: CommaDelimitedList

    DBInstanceId:
        Description: The ID of the instance to use for the database
        Type: String

    DBInstanceType:
        Description: The instance type to use for the database
        Type: String
        AllowedValues:
            - 'db.r6g.large'
        Default: 'db.r6g.large'

    DBEngineVersion:
        Description: Select Database Engine Version
        Type: String
        Default: '17.4'

    DBPort:
        Description: TCP/IP Port for the Database Instance
        Type: Number
        Default: 5432
        ConstraintDescription: 'Must be in the range [1115-65535]'
        MinValue: 1115
        MaxValue: 65535
    
    DBName:
        Description: Database Name
        Type: String
        MinLength: '1'
        MaxLength: '64'
        AllowedPattern: "^[a-zA-Z]+[0-9a-zA-Z_]*$" 
        ConstraintDescription: Must start with a letter. Only numbers, letters, and _ accepted. max length 64 characters

    DBMasterUsername:
        Description: The master username for the database
        Type: String
        MinLength: 1
        MaxLength: 16
        AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
        ConstraintDescription: must begin with a letter and contain only alphanumeric characters.

    DBMasterPassword:
        Description: The master password for the database
        NoEcho: true
        Type: String
        MinLength: 10
        MaxLength: 25
        AllowedPattern: '[a-zA-Z0-9]*'
        ConstraintDescription: must contain only alphanumeric characters.

    EnvironmentDesc:
        Description: An environment name that will be used in the resource descriptions
        Type: String
        AllowedValues:
            - 'Dev'
            - 'Staging'
            - 'Prod'
        Default: 'Dev'

    BaseName:
        Description: Base name for the resources
        Type: String
        Default: UPP Ontotext Backup RDS

    EnvironmentTag:
        Description: Tag detail for the Environment; d for team clusters, t for staging and p for production
        Type: String
        AllowedValues:
            - 'd'
            - 't'
            - 'p'
        Default: 'd'

    TeamDLTag:
        Description: Tag of the TeamDL
        Type: String
        AllowedPattern: ^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})$
        ConstraintDescription: There must be a valid email address for the TeamDL
        Default: universal.publishing.platform@ft.com

    SystemCodeTag:
        Description: The system code for the environment
        Type: String
        Default: upp-ontotext-backup-aurora

Mappings:
    EnvironmentCidrs:
        d:
            Name: Test
            VPC: 10.172.32.0/21
            EUEKS: 10.169.0.0/18
            EUEKSDescription: DB access from Content Platform Test EU EKS
            USEKS: 10.168.0.0/18
            USEKSDescription: DB access from Content Platform Test US EKS
        t:
            Name: Prod
            VPC: 10.172.40.0/21
            EUEKS: 10.169.64.0/18
            EUEKSDescription: DB access from Content Platform Prod EU EKS
            USEKS: 10.168.64.0/18
            USEKSDescription: DB access from Content Platform Prod US EKS
        p:
            Name: Prod
            VPC: 10.172.40.0/21
            EUEKS: 10.169.64.0/18
            EUEKSDescription: DB access from Content Platform Prod EU EKS
            USEKS: 10.168.64.0/18
            USEKSDescription: DB access from Content Platform Prod US EKS
Resources:
    DBSubnetGroup:
        Type: AWS::RDS::DBSubnetGroup
        Properties:
            DBSubnetGroupDescription: !Join ["" , [!Ref BaseName, " Subnet Group ", !Ref EnvironmentDesc]]
            SubnetIds: !Ref DBSubnetIds
            Tags:
                - Key: Name
                  Value: !Join ["" , [!Ref BaseName, " Subnet Group ", !Ref EnvironmentDesc]]
                - Key: environment
                  Value: !Ref EnvironmentTag
                - Key: teamDL
                  Value: !Ref TeamDLTag
                - Key: systemCode
                  Value: !Ref SystemCodeTag

    DBSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: !Join ["" , [!Ref BaseName, " Security Group ", !Ref EnvironmentDesc]]
            VpcId: !Ref VpcId
            SecurityGroupIngress:
                - IpProtocol: tcp
                  FromPort: 5432
                  ToPort: 5432
                  CidrIp: 10.165.0.0/24
                  Description: AWS Client VPN, eu-west-1
                - IpProtocol: tcp
                  FromPort: 5432
                  ToPort: 5432
                  CidrIp: 10.166.0.0/24
                  Description: AWS Client VPN, us-east-1
                - IpProtocol: tcp
                  FromPort: 5432
                  ToPort: 5432
                  CidrIp: !FindInMap [EnvironmentCidrs, !Ref EnvironmentTag, VPC]
                  Description: !Join ["", ["DB access from Content Platform ", !FindInMap [EnvironmentCidrs, !Ref EnvironmentTag, Name], " VPC"]]
                - IpProtocol: tcp
                  FromPort: 5432
                  ToPort: 5432
                  CidrIp: !FindInMap [EnvironmentCidrs, !Ref EnvironmentTag, EUEKS]
                  Description: !FindInMap [EnvironmentCidrs, !Ref EnvironmentTag, EUEKSDescription]
                - IpProtocol: tcp
                  FromPort: 5432
                  ToPort: 5432
                  CidrIp: !FindInMap [EnvironmentCidrs, !Ref EnvironmentTag, USEKS]
                  Description: !FindInMap [EnvironmentCidrs, !Ref EnvironmentTag, USEKSDescription]
                - IpProtocol: tcp
                  FromPort: 5432
                  ToPort: 5432
                  CidrIp: 10.174.224.0/21
                  Description: DB access from FT-Professional-Prod VPC, us-east-1
                - IpProtocol: tcp
                  FromPort: 5432
                  ToPort: 5432
                  CidrIp: 10.172.0.0/21
                  Description: DB access from FT-Professional-Prod VPC, eu-west-1
                - IpProtocol: tcp
                  FromPort: 5432
                  ToPort: 5432
                  CidrIp: 10.174.184.0/21
                  Description: DB access from FT-Professional-Test VPC, us-east-1
                - IpProtocol: tcp
                  FromPort: 5432
                  ToPort: 5432
                  CidrIp: 10.172.8.0/21
                  Description: DB access from FT-Professional-Test VPC, eu-west-1
            Tags:
                - Key: Name
                  Value: !Join ["" , [!Ref BaseName, " Subnet Group ", !Ref EnvironmentDesc]]
                - Key: environment
                  Value: !Ref EnvironmentTag
                - Key: teamDL
                  Value: !Ref TeamDLTag
                - Key: systemCode
                  Value: !Ref SystemCodeTag

    DBCluster:
        Type: AWS::RDS::DBCluster
        Properties:
            Engine: aurora-postgresql
            EngineVersion: !Ref DBEngineVersion
            Port: !Ref DBPort
            DatabaseName: !Ref DBName
            MasterUsername: !Ref DBMasterUsername
            MasterUserPassword: !Ref DBMasterPassword
            DBSubnetGroupName: !Ref DBSubnetGroup
            VpcSecurityGroupIds:
                - !GetAtt
                    - DBSecurityGroup
                    - GroupId
                - !Ref ResourcesSgId
            Tags:
                - Key: Name
                  Value: !Join ["" , [!Ref BaseName, " Cluster ", !Ref EnvironmentDesc]]
                - Key: environment
                  Value: !Ref EnvironmentTag
                - Key: teamDL
                  Value: !Ref TeamDLTag
                - Key: systemCode
                  Value: !Ref SystemCodeTag

    DBPrimaryInstance:
        Type: AWS::RDS::DBInstance
        Properties:
            Engine: aurora-postgresql
            EngineVersion: !Ref DBEngineVersion
            DBClusterIdentifier: !Ref DBCluster
            DBInstanceClass: !Ref DBInstanceType
            DBInstanceIdentifier: !Ref DBInstanceId
            Tags:
                - Key: Name
                  Value: !Join ["" , [!Ref BaseName, " Instance ", !Ref EnvironmentDesc]]
                - Key: environment
                  Value: !Ref EnvironmentTag
                - Key: teamDL
                  Value: !Ref TeamDLTag
                - Key: systemCode
                  Value: !Ref SystemCodeTag
